app = "autotread"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADING_MODE = "paper"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "autotread_data"
  destination = "/data"
